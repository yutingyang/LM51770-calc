<html lang="zh-Hant">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LM51770 Buck-Boost Calculator</title>
<style>
:root {

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1f27; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2c333f;
    --accent: #6ea8ff; --accent-soft: #1c2a40; --warn: #ff8a80; --warn-soft: #3a1e1e;
    --ok: #4cc38a; --grid: #262c36;
    --c1: #6ea8ff; --c2: #ff9a57; --c3: #4cc38a; --c4: #c39bff; --c5: #e3c35a; --c6: #ff7aa8;
    --buck: #1d2d45; --bb: #3a3020; --boost: #1d3a2a;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1f27; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2c333f;
  --accent: #6ea8ff; --accent-soft: #1c2a40; --warn: #ff8a80; --warn-soft: #3a1e1e;
  --ok: #4cc38a; --grid: #262c36;
  --c1: #6ea8ff; --c2: #ff9a57; --c3: #4cc38a; --c4: #c39bff; --c5: #e3c35a; --c6: #ff7aa8;
  --buck: #1d2d45; --bb: #3a3020; --boost: #1d3a2a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
header { padding: 16px; overflow-wrap: anywhere; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { margin: 0 0 4px; font-size: 20px; }
header p { margin: 0; color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 10px; }
.bar label { display: flex; gap: 6px; align-items: center; }
select, input[type=number], button { font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 16px; padding: 16px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; overflow-x: auto; }
.inputs details { border-bottom: 1px solid var(--line); padding: 6px 0; }
.inputs details:last-child { border-bottom: 0; }
.inputs summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.field { display: grid; grid-template-columns: 1fr 96px 52px; gap: 6px; align-items: center; margin: 4px 0; }
.field span.u { color: var(--muted); font-size: 12px; }
.field input, .field select { width: 100%; }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mos td, .mos th { padding: 2px 3px; }
.mos input { width: 100%; min-width: 0; padding: 2px 3px; }
.results { display: grid; gap: 16px; min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
h2 { font-size: 16px; margin: 0 0 8px; }
h3 { font-size: 14px; margin: 12px 0 6px; color: var(--muted); }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 600; }
.tag.BUCK { background: var(--buck); } .tag.BOOST { background: var(--boost); } .tag.BUCK-BOOST { background: var(--bb); }
.warn { color: var(--warn); font-weight: 600; }
.ok { color: var(--ok); }
.note { color: var(--muted); font-size: 12px; }
.chart { width: 100%; overflow: hidden; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.kpi b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: 12px; }
#vinpanel { margin: 16px 16px 0; }
.vp-grid { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; }
.vp-grid.half { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.vp-grid > div { min-width: 0; }
#vin_phase { overflow-x: auto; }
@media (max-width: 900px) { .vp-grid, .vp-grid.half { grid-template-columns: 1fr; } }
.basic { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; }
.basic .field { grid-template-columns: 1fr 76px 34px; margin: 2px 0; }
.slider { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0 10px; }
.slider input[type=range] { flex: 1 1 260px; accent-color: var(--accent); height: 28px; }
.slider input[type=number] { width: 90px; font-size: 16px; font-weight: 600; }
.slider .quick button { padding: 2px 8px; font-size: 12px; }
.modebig { font-size: 22px; font-weight: 700; padding: 2px 12px; border-radius: 6px; display: inline-block; }
.modebig.BUCK { background: var(--buck); } .modebig.BOOST { background: var(--boost); } .modebig.BUCK-BOOST { background: var(--bb); }
.why { color: var(--muted); margin: 6px 0 10px; }
.formula { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; background: var(--accent-soft);
  border-radius: 6px; padding: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.sw { display: inline-block; min-width: 30px; text-align: center; border-radius: 4px; font-size: 12px; font-weight: 600; }
.sw.on { background: var(--accent); color: #fff; } .sw.off { color: var(--muted); border: 1px solid var(--line); }
.modebar text { fill: var(--ink); font-size: 11px; }
.modebar .lbl { fill: var(--muted); }
.tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; font-size: 12px; display: none; z-index: 10; white-space: pre; }
</style>
</head>
<body>
<header>
  <h1>LM51770 四開關 Buck-Boost 計算工具</h1>
  <p>由 <code>LM51770_Buck-Boost_Quickstart_Tool_V1_0_1.xlsm</code> 轉換。依 Design Converter 的 Step 1 – 8 計算功率級、補償與 Bode 圖；duty 預設依 LM5177 四開關時序（Buck / Buck-Boost / Boost 三區、三相位）計算。</p>
  <div class="bar">
    <label>Duty 模型
      <select id="model">
        <option value="lm5177">LM5177 時序（預設）</option>
        <option value="xlsm">xlsm 原始（VIN&gt;VOUT 判斷）</option>
      </select></label>
    <label>轉換區遲滯

        <option value="falling">VIN 下降</option>

    <label>主題

<section class="panel" id="vinpanel">
  <h2>基本參數與 VIN 工作點</h2>
  <div class="vp-grid">
    <div><div class="basic" id="basic"></div>
      <p class="note">這些欄位與左側 Step 1 / 2 / 3 的輸入同步。</p></div>
    <div>
      <div class="slider">
        <b>VIN</b>
        <input type="range" id="vin_slider" step="0.05" aria-label="VIN">

      </div>
      <div id="vin_out"></div>
    </div>
  </div>
  <div class="vp-grid half" style="margin-top:8px">
    <div><h3>本 VIN 的三相位（開關狀態）</h3><div id="vin_phase"></div></div>
    <div><h3>本 VIN 的電感電流波形</h3><div class="chart" id="ch_vin_il"></div></div>
  </div>
</section>
<main>
  <section class="panel inputs" id="inputs"></section>
  <section class="results" id="results"></section>

    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${label}</td>`;
    for (const q of ["q1", "q2", "q3", "q4"]) {
      const td = document.createElement("td");
      const inp = document.createElement("input");
      inp.type = "number"; inp.step = "any"; inp.value = round6(design[q][key] / scale);
      inp.addEventListener("change", () => { design[q][key] = Number(inp.value) * scale; update(); });
      td.append(inp); tr.append(td);
    }
    const tu = document.createElement("td"); tu.className = "note"; tu.textContent = unit; tr.append(tu);
    tbl.append(tr);
  }
  det.append(tbl);
  box.append(det);
}

/* ---------- SVG plotting ---------- */
function niceTicks(lo, hi, n) {
  const span = hi - lo || 1, step0 = span / (n || 5), mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= (n || 5)) || mag * 10;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9 * step; v += step) out.push(+v.toPrecision(12));
  return out;
}
function fmtTick(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6) + "M"; if (a >= 1e3) return (v / 1e3) + "k"; return String(+v.toPrecision(4));
}
/* opts: {xlog, xlabel, ylabel, y2label, series:[{x,y,name,color,axis:1|2,dash,step}], vlines:[{x,label}], bands:[{x0,x1,fill,label}], height} */
function plot(el, opts) {
  const W = 640, H = opts.height || 300, m = { l: 52, r: opts.y2label ? 52 : 14, t: 12, b: 40 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const xs = opts.series.flatMap(s => s.x);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (opts.xrange) [x0, x1] = opts.xrange;
  const tx = opts.xlog ? (v => (Math.log10(v) - Math.log10(x0)) / (Math.log10(x1) - Math.log10(x0)) * pw + m.l)
    : (v => (v - x0) / (x1 - x0 || 1) * pw + m.l);
  const rng = ax => {
    const ys = opts.series.filter(s => (s.axis || 1) === ax).flatMap(s => s.y).filter(isFinite);
    if (!ys.length) return null;
    let lo = Math.min(...ys), hi = Math.max(...ys);
    if (opts["y" + ax + "range"]) [lo, hi] = opts["y" + ax + "range"];
    const pad = (hi - lo) * 0.06 || 1;
    const t = niceTicks(lo - pad, hi + pad, 6);
    return { lo: Math.min(t[0], lo), hi: Math.max(t[t.length - 1], hi), ticks: t };
  };
  const r1 = rng(1), r2 = rng(2);
  const ty = (r, v) => m.t + ph - (v - r.lo) / (r.hi - r.lo || 1) * ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.title || "chart"}">`;
  for (const b of opts.bands || []) {
    const a = tx(Math.max(b.x0, x0)), z = tx(Math.min(b.x1, x1));
    if (z > a) s += `<rect x="${a}" y="${m.t}" width="${z - a}" height="${ph}" fill="${b.fill}" opacity="0.7"/>` +
      (b.label ? `<text x="${(a + z) / 2}" y="${m.t + 12}" text-anchor="middle">${b.label}</text>` : "");
  }
  // x grid
  let xt;
  if (opts.xlog) { xt = []; for (let e = Math.ceil(Math.log10(x0)); e <= Math.floor(Math.log10(x1)); e++) xt.push(Math.pow(10, e)); }
  else xt = niceTicks(x0, x1, 8);
  for (const v of xt) s += `<line x1="${tx(v)}" x2="${tx(v)}" y1="${m.t}" y2="${m.t + ph}" stroke="var(--grid)"/><text x="${tx(v)}" y="${m.t + ph + 14}" text-anchor="middle">${fmtTick(v)}</text>`;
  if (opts.xlog) for (let e = Math.floor(Math.log10(x0)); e < Math.log10(x1); e++) for (let k = 2; k < 10; k++) {
    const v = k * Math.pow(10, e); if (v > x0 && v < x1) s += `<line x1="${tx(v)}" x2="${tx(v)}" y1="${m.t}" y2="${m.t + ph}" stroke="var(--grid)" opacity="0.5"/>`;
  }
  if (r1) for (const v of r1.ticks) s += `<line x1="${m.l}" x2="${m.l + pw}" y1="${ty(r1, v)}" y2="${ty(r1, v)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${ty(r1, v) + 4}" text-anchor="end">${fmtTick(v)}</text>`;
  if (r2) for (const v of r2.ticks) s += `<text x="${m.l + pw + 6}" y="${ty(r2, v) + 4}">${fmtTick(v)}</text>`;
  if (opts.zeroLine && r1 && r1.lo < 0 && r1.hi > 0) s += `<line x1="${m.l}" x2="${m.l + pw}" y1="${ty(r1, 0)}" y2="${ty(r1, 0)}" stroke="var(--muted)" stroke-width="0.8"/>`;
  for (const v of opts.vlines || []) if (v.x >= x0 && v.x <= x1) s += `<line x1="${tx(v.x)}" x2="${tx(v.x)}" y1="${m.t}" y2="${m.t + ph}" stroke="${v.color || "var(--muted)"}" stroke-dasharray="4 3"/><text x="${tx(v.x) + 3}" y="${m.t + ph - 4}">${v.label || ""}</text>`;
  for (const se of opts.series) {
    const r = (se.axis || 1) === 1 ? r1 : r2;
    let dpath = "", pen = false;
    se.x.forEach((xv, i) => {
      const yv = se.y[i];
      if (!isFinite(yv) || xv < x0 || xv > x1) { pen = false; return; }
      dpath += (pen ? "L" : "M") + tx(xv).toFixed(1) + "," + ty(r, yv).toFixed(1); pen = true;
    });
    s += `<path d="${dpath}" fill="none" stroke="${se.color}" stroke-width="2" ${se.dash ? `stroke-dasharray="${se.dash}"` : ""}/>`;
  }
  for (const p of opts.points || []) {
    const r = (p.axis || 1) === 1 ? r1 : r2;
    s += `<circle cx="${tx(p.x)}" cy="${ty(r, p.y)}" r="4" fill="${p.color}"/>`;
  }
  s += `<rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="none" stroke="var(--line)"/>`;
  s += `<text x="${m.l + pw / 2}" y="${H - 6}" text-anchor="middle">${opts.xlabel || ""}</text>`;
  if (opts.ylabel) s += `<text transform="translate(12 ${m.t + ph / 2}) rotate(-90)" text-anchor="middle">${opts.ylabel}</text>`;
  if (opts.y2label) s += `<text transform="translate(${W - 8} ${m.t + ph / 2}) rotate(90)" text-anchor="middle">${opts.y2label}</text>`;
  s += `<rect class="hit" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="transparent"/></svg>`;
  el.innerHTML = s + `<div class="legend">${opts.series.filter(x => x.name).map(x => `<span><i style="background:${x.color}"></i>${x.name}</span>`).join("")}</div>`;
  // hover readout
  const svg = el.querySelector("svg"), tip = $("#tip");
  svg.querySelector(".hit").addEventListener("mousemove", ev => {
    const bb = svg.getBoundingClientRect(), px = (ev.clientX - bb.left) / bb.width * W;
    const fr = (px - m.l) / pw;
    const xv = opts.xlog ? Math.pow(10, Math.log10(x0) + fr * (Math.log10(x1) - Math.log10(x0))) : x0 + fr * (x1 - x0);
    let lines = [`${opts.xlabel || "x"}: ${fmtTick(+xv.toPrecision(4))}`];
    for (const se of opts.series) {
      if (!se.name) continue;
      let bi = 0, bd = Infinity;
      se.x.forEach((v, i) => { const dd = Math.abs((opts.xlog ? Math.log10(v) - Math.log10(xv) : v - xv)); if (dd < bd) { bd = dd; bi = i; } });
      lines.push(`${se.name}: ${fmt(se.y[bi], 2)}`);
    }
    tip.textContent = lines.join("\n"); tip.style.display = "block";
    tip.style.left = (ev.clientX + 14) + "px"; tip.style.top = (ev.clientY + 10) + "px";
  });
  svg.querySelector(".hit").addEventListener("mouseleave", () => { tip.style.display = "none"; });
}

/* display-only phase unwrap (removes ±360° jumps) */
function unwrap(ph) {
  const out = []; let off = 0;
  ph.forEach((v, i) => { if (i) { const d = v + off - out[i - 1]; if (d > 180) off -= 360; else if (d < -180) off += 360; } out.push(v + off); });
  return out;
}

    bands[bands.length - 1].x1 = ev.vin[Math.min(i + 1, ev.vin.length - 1)];
  }
  plot($("#ch_mode"), { xlabel: "VIN (V)", ylabel: "Duty", height: 220, y1range: [0, 1],
    bands: bands.map(b => ({ x0: b.x0, x1: b.x1, fill: css(b.m === "BUCK" ? "--buck" : b.m === "BOOST" ? "--boost" : "--bb"), label: b.m })),
    series: [{ x: ev.vin, y: ev.duty_buck_leg, name: "D Buck 臂 (Q1)", color: css("--c1") },
      { x: ev.vin, y: ev.duty_boost_leg, name: "D Boost 臂 (Q4)", color: css("--c2") }],
    vlines: K.map(k => ({ x: ops[k].vin, label: k })) });
  // inductor current waveform
  const wf = K.map((k, i) => {
    const o = ops[k], xs = [0], ys = [o.segments[0].i_start]; let t = 0;
    for (const sg of o.segments) { t += sg.dt; xs.push(t * 1e6); ys.push(sg.i_end); }
    return { x: xs, y: ys, name: `${KL[k]} ${o.mode}`, color: css(["--c1", "--c3", "--c2"][i]) };
  });
  plot($("#ch_il"), { xlabel: "t (µs)", ylabel: "iL (A)", height: 240, series: wf });
  // bode
  const bv = r.bode_voltage, bi = r.bode_current_limit;
  plot($("#ch_bode"), { xlog: true, xlabel: "頻率 (Hz)", ylabel: "增益 (dB)", y2label: "相位 (°)", zeroLine: true,
    series: [{ x: bv.f, y: bv.gain, name: "迴路增益", color: css("--c1") }, { x: bv.f, y: unwrap(bv.phase), name: "迴路相位", color: css("--c2"), axis: 2 }],
    vlines: [{ x: bv.fc, label: `fc ${fmt(bv.fc / 1e3, 2)} kHz, PM ${fmt(bv.pm, 1)}°`, color: css("--c3") }],
    points: bv.fc ? [{ x: bv.fc, y: 0, color: css("--c3") }] : [] });
  plot($("#ch_bode_parts"), { xlog: true, xlabel: "頻率 (Hz)", ylabel: "增益 (dB)", y2label: "相位 (°)", zeroLine: true, height: 260,
    series: [{ x: bv.f, y: bv.ea_gain, name: "EA 增益", color: css("--c4") }, { x: bv.f, y: bv.plant_gain, name: "Plant 增益", color: css("--c3") },
      { x: bv.f, y: bv.ea_phase, name: "EA 相位", color: css("--c4"), axis: 2, dash: "5 4" }, { x: bv.f, y: bv.plant_phase, name: "Plant 相位", color: css("--c3"), axis: 2, dash: "5 4" }] });
  plot($("#ch_bode_il"), { xlog: true, xlabel: "頻率 (Hz)", ylabel: "增益 (dB)", y2label: "相位 (°)", zeroLine: true,
    series: [{ x: bi.f, y: bi.gain, name: "迴路增益", color: css("--c1") }, { x: bi.f, y: unwrap(bi.phase), name: "迴路相位", color: css("--c2"), axis: 2 },
      { x: bi.f, y: bi.plant_gain, name: "Plant 增益", color: css("--c3"), dash: "5 4" }],
    vlines: [{ x: bi.fc, label: `fc ${fmt(bi.fc / 1e3, 2)} kHz, PM ${fmt(bi.pm, 1)}°`, color: css("--c3") }] });
  // efficiency
  plot($("#ch_eff_vin"), { xlabel: "VIN (V)", ylabel: "效率 (%)", y2label: "損耗 (W)",
    bands: bands.map(b => ({ x0: b.x0, x1: b.x1, fill: css(b.m === "BUCK" ? "--buck" : b.m === "BOOST" ? "--boost" : "--bb") })),
    series: [{ x: ev.vin, y: ev.efficiency, name: "效率", color: css("--c1") },
      { x: ev.vin, y: ev.inductor, name: "電感損耗", color: css("--c3"), axis: 2, dash: "5 4" },
      { x: ev.vin, y: ev.buck_ctrl.map((v, i) => v + ev.buck_sync[i] + ev.boost_ctrl[i] + ev.boost_sync[i]), name: "MOSFET 損耗", color: css("--c2"), axis: 2, dash: "5 4" }] });
  const el = r.efficiency_vs_load;
  plot($("#ch_eff_load"), { xlabel: "IOUT (A)", ylabel: "效率 (%)", y2label: "損耗 (W)", height: 260,
    series: [{ x: el.iout, y: el.efficiency, name: "效率", color: css("--c1") }, { x: el.iout, y: el.total_loss, name: "總損耗", color: css("--c2"), axis: 2, dash: "5 4" }] });
}

/* ---------- 基本參數 + VIN 滑桿 ---------- */
const BASIC = [["vin_min", "VIN(min)", "V", 1], ["vin_max", "VIN(max)", "V", 1], ["vin_nom", "VIN(nom)", "V", 1],
  ["vout", "VOUT", "V", 1], ["iout", "IOUT", "A", 1], ["fsw", "fSW", "kHz", 1e3], ["lf", "L", "µH", 1e-6],
  ["rdcr", "DCR", "mΩ", 1e-3], ["rs", "RS", "mΩ", 1e-3], ["efficiency", "η 估計", "%", 0.01]];
let sliderVin = null;

function buildBasic() {
  const box = $("#basic");
  box.innerHTML = "";
  for (const [key, label, unit, scale] of BASIC) {
    const row = document.createElement("div");
    row.className = "field";
    const inp = document.createElement("input");
    inp.type = "number"; inp.step = "any"; inp.id = "bp_" + key;
    inp.addEventListener("change", () => { design[key] = Number(inp.value) * scale; syncInputs(); update(); });
    const lab = document.createElement("span"); lab.textContent = label;
    const u = document.createElement("span"); u.className = "u"; u.textContent = unit;
    row.append(lab, inp, u); box.append(row);
  }
  syncInputs();
}
/* 讓左側輸入與基本參數欄位顯示同一個值 */
function syncInputs() {
  const all = FIELDS.flatMap(g => g[1]).concat(BASIC);
  for (const [key, , , scale, , opts] of all) {
    for (const id of ["in_" + key, "bp_" + key]) {
      const el = document.getElementById(id);
      if (!el || el === document.activeElement) continue;
      if (opts) el.value = String(design[key]);
      else el.value = design[key] === null ? "" : round6(design[key] / scale);
    }
  }
}

function modeReason(v, op, tr, model) {
  const f = x => fmt(x, 2) + " V";
  if (model === "xlsm") return `xlsm 原始算法：VIN ${v > design.vout ? ">" : "≤"} VOUT (${f(design.vout)}) → ${op.mode}`;
  if (!design.mode_fpwm) return `PSM 模式：轉換點都簡化為 VOUT (${f(design.vout)})，VIN ${v > design.vout ? ">" : "≤"} VOUT → ${op.mode}`;
  if (design.vin_direction === "falling") {
    if (op.mode === "BUCK") return `VIN 下降：VIN > Buck→BB ${f(tr.vin_buck_to_bb)} → 維持 BUCK`;
    if (op.mode === "BOOST") return `VIN 下降：VIN ≤ BB→Boost ${f(tr.vin_bb_to_boost)} → BOOST`;
    return `VIN 下降：BB→Boost ${f(tr.vin_bb_to_boost)} < VIN ≤ Buck→BB ${f(tr.vin_buck_to_bb)} → BUCK-BOOST`;
  }
  if (op.mode === "BUCK") return `VIN 上升：VIN > BB→Buck ${f(tr.vin_bb_to_buck)} → BUCK`;
  if (op.mode === "BOOST") return `VIN 上升：VIN ≤ Boost→BB ${f(tr.vin_boost_to_bb)} → 維持 BOOST`;
  return `VIN 上升：Boost→BB ${f(tr.vin_boost_to_bb)} < VIN ≤ BB→Buck ${f(tr.vin_bb_to_buck)} → BUCK-BOOST`;
}

function dutyFormula(v, op, tr, model) {
  const d = design, n = (x, k = 4) => fmt(x, k), T = 1 / d.fsw;
  if (op.mode === "BUCK-BOOST") {
    return `T  = 1/fSW = ${n(T * 1e9, 1)} ns,  tmin = ${n(tr.t_min_pulse * 1e9, 1)} ns
t1 (Q1+Q3) = T − (0.175·T + 2·tmin)          = ${n(op.t1 * 1e9, 1)} ns
t2 (Q1+Q4) = (VOUT·T − VIN·t1) / (VIN + VOUT) = (${n(d.vout, 2)}·${n(T * 1e9, 1)} − ${n(v, 2)}·${n(op.t1 * 1e9, 1)}) / ${n(v + d.vout, 2)} = ${n(op.t2 * 1e9, 1)} ns
t3 (Q2+Q3) = T − t1 − t2                      = ${n(op.t3 * 1e9, 1)} ns
D_buck  (Q1) = (t1 + t2)/T = ${n(op.d_buck_leg)}
D_boost (Q4) = t2 / T      = ${n(op.d_boost_leg)}
檢查 VOUT/VIN = D_buck / (1 − D_boost) = ${n(op.d_buck_leg / (1 - op.d_boost_leg))}  (${n(d.vout / v)})`;
  }
  if (model === "xlsm") {
    if (op.mode === "BUCK") return `D = (VOUT + IOUT·(DCR+RS)) / (VIN + IOUT·RS)
  = (${n(d.vout, 2)} + ${n(op.iout, 2)}·${n((d.rdcr + d.rs) * 1e3, 2)} mΩ) / (${n(v, 2)} + ${n(op.iout, 2)}·${n(d.rs * 1e3, 2)} mΩ) = ${n(op.duty)}`;
    return `IIN = VOUT·IOUT/(VIN·η) = ${n(op.iin, 3)} A
D = (VOUT − VIN + IIN·DCR) / (VOUT − IIN·RS)
  = (${n(d.vout, 2)} − ${n(v, 2)} + ${n(op.iin, 3)}·${n(d.rdcr * 1e3, 2)} mΩ) / (${n(d.vout, 2)} − ${n(op.iin, 3)}·${n(d.rs * 1e3, 2)} mΩ) = ${n(op.duty)}`;
  }
  const r1 = d.q1.rdson, r2 = d.q2.rdson, r3 = d.q3.rdson, r4 = d.q4.rdson;
  if (op.mode === "BUCK") return `D_buck = (VOUT + (RDS2+RS+DCR)·IOUT) / (VIN + (RS+RDS2−RDS1)·IOUT)
       = (${n(d.vout, 2)} + ${n((r2 + d.rs + d.rdcr) * 1e3, 2)} mΩ·${n(op.iout, 2)}) / (${n(v, 2)} + ${n((d.rs + r2 - r1) * 1e3, 2)} mΩ·${n(op.iout, 2)}) = ${n(op.duty)}
D_boost = 0（Q3 常通、Q4 關）`;
  return `IIN = VOUT·IOUT/(VIN·η) = ${n(op.iin, 3)} A
D_boost = (VOUT + (RDS3+DCR)·IIN − VIN) / (VOUT + (RDS3−RDS4−RS)·IIN)
        = (${n(d.vout, 2)} + ${n((r3 + d.rdcr) * 1e3, 2)} mΩ·${n(op.iin, 3)} − ${n(v, 2)}) / (${n(d.vout, 2)} + ${n((r3 - r4 - d.rs) * 1e3, 2)} mΩ·${n(op.iin, 3)}) = ${n(op.duty)}
D_buck = 1（Q1 常通、Q2 關）`;
}

/* 兩列模式帶：VIN 上升 / VIN 下降，標示轉換電壓與目前 VIN */
function modeBar(v, tr, model) {
  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const lo = Math.min(design.vin_min, v), hi = Math.max(design.vin_max, v);
  const W = 640, H = 104, ml = 66, mr = 12, pw = W - ml - mr;
  const tx = x => ml + (Math.min(Math.max(x, lo), hi) - lo) / (hi - lo || 1) * pw;
  const fill = m => css(m === "BUCK" ? "--buck" : m === "BOOST" ? "--boost" : "--bb");
  const simple = model === "xlsm" || !design.mode_fpwm;
  const rows = simple
    ? [{ name: model === "xlsm" ? "xlsm" : "PSM", a: design.vout, b: design.vout, active: true }]
    : [{ name: "VIN 上升", a: tr.vin_boost_to_bb, b: tr.vin_bb_to_buck, active: design.vin_direction !== "falling" },
       { name: "VIN 下降", a: tr.vin_bb_to_boost, b: tr.vin_buck_to_bb, active: design.vin_direction === "falling" }];
  let s = `<svg class="modebar" viewBox="0 0 ${W} ${H}" role="img" aria-label="Buck / Buck-Boost / Boost 區間">`;
  rows.forEach((r, i) => {
    const y = 8 + i * 34, h = 24;
    const segs = [["BOOST", lo, r.a], ["BUCK-BOOST", r.a, r.b], ["BUCK", r.b, hi]];
    for (const [m, a, b] of segs) {
      const x0 = tx(a), x1 = tx(b);
      if (x1 - x0 < 0.5) continue;
      s += `<rect x="${x0}" y="${y}" width="${x1 - x0}" height="${h}" fill="${fill(m)}" stroke="var(--line)"/>`;
      if (x1 - x0 > 46) s += `<text x="${(x0 + x1) / 2}" y="${y + 16}" text-anchor="middle">${m}</text>`;
    }
    s += `<text class="lbl" x="${ml - 6}" y="${y + 16}" text-anchor="end" font-weight="${r.active ? 700 : 400}">${r.name}${r.active ? " ●" : ""}</text>`;
    for (const t of new Set([r.a, r.b])) if (t > lo && t < hi) s += `<text class="lbl" x="${tx(t)}" y="${y + h + 9}" text-anchor="middle" font-size="10">${fmt(t, 2)}</text>`;
  });
  const by = 8 + rows.length * 34;
  s += `<text class="lbl" x="${ml}" y="${by + 10}">${fmt(lo, 1)} V</text><text class="lbl" x="${ml + pw}" y="${by + 10}" text-anchor="end">${fmt(hi, 1)} V</text>`;
  s += `<line x1="${tx(v)}" x2="${tx(v)}" y1="2" y2="${by}" stroke="var(--warn)" stroke-width="2"/>`;
  s += `<text x="${tx(v)}" y="${by + 10}" text-anchor="middle" fill="var(--warn)" font-weight="700">VIN ${fmt(v, 2)}</text></svg>`;
  return s;
}

function renderVin() {
  const model = $("#model").value;
  const lo = design.vin_min, hi = design.vin_max;
  if (sliderVin === null || !isFinite(sliderVin)) sliderVin = design.vin_nom;
  sliderVin = Math.min(Math.max(sliderVin, lo), hi);
  const sl = $("#vin_slider");
  sl.min = lo; sl.max = hi; sl.value = sliderVin;
  if (document.activeElement !== $("#vin_value")) $("#vin_value").value = round6(sliderVin);
  const v = sliderVin;
  let op, ls, tr;
  try {
    op = operatingPoint(design, v, null, model);
    ls = losses(design, v);
    tr = lm5177Transitions(design.fsw, design.vout, design.timing_device);
  } catch (e) { $("#vin_out").innerHTML = `<p class="warn">計算錯誤：${e.message}</p>`; return; }
  const T = 1 / design.fsw;
  $("#vin_out").innerHTML = `
    <div><span class="modebig ${op.mode}">${op.mode}</span></div>
    <div class="why">${modeReason(v, op, tr, model)}</div>
    <div class="kpis">
      <div class="kpi"><span>D Buck 臂 (Q1 導通比)</span><b>${fmt(op.d_buck_leg, 4)}</b></div>
      <div class="kpi"><span>D Boost 臂 (Q4 導通比)</span><b>${fmt(op.d_boost_leg, 4)}</b></div>
      <div class="kpi"><span>轉換比 VOUT/VIN</span><b>${fmt(design.vout / v, 4)}</b></div>
      <div class="kpi"><span>IIN / IL 平均</span><b>${fmt(op.iin, 2)} / ${fmt(op.il_avg, 2)} A</b></div>
      <div class="kpi"><span>IL 峰值 / ΔIL</span><b>${fmt(op.il_peak, 2)} / ${fmt(op.ripple, 2)} A</b></div>
      <div class="kpi"><span>效率（估算）</span><b>${fmt(ls.efficiency * 100, 2)} %</b></div>
    </div>
    <h3>Duty 計算</h3><div class="formula">${dutyFormula(v, op, tr, model)}</div>
    <h3>模式區間</h3><div class="chart">${modeBar(v, tr, model)}</div>`;
  const slope = sw => {
    const a = sw.includes("Q1"), b = sw.includes("Q3");
    if (a && b) return "(VIN−VOUT)/L"; if (a) return "VIN/L"; if (b) return "−VOUT/L"; return "0";
  };
  const swCell = (sg, q) => `<td><span class="sw ${sg.on.includes(q) ? "on" : "off"}">${sg.on.includes(q) ? "ON" : "off"}</span></td>`;
  $("#vin_phase").innerHTML = `<table><tr><th>相位</th><th>時間</th><th>%T</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>diL/dt</th><th>iL (A)</th></tr>
    ${op.segments.map((sg, i) => `<tr><td>t${i + 1}</td><td class="v">${fmt(sg.dt * 1e9, 0)} ns</td><td class="v">${fmt(sg.dt / T * 100, 1)}</td>
      ${["Q1", "Q2", "Q3", "Q4"].map(q => swCell(sg, q)).join("")}<td>${slope(sg.on)}</td>
      <td class="v">${fmt(sg.i_start, 2)} → ${fmt(sg.i_end, 2)}</td></tr>`).join("")}</table>
    <p class="note">Q1/Q2：Buck 臂高側 / 低側；Q3/Q4：Boost 臂高側 / 低側。RMS：IL ${fmt(op.il_rms, 2)} A、Q1 ${fmt(op.irms.Q1, 2)}、Q2 ${fmt(op.irms.Q2, 2)}、Q3 ${fmt(op.irms.Q3, 2)}、Q4 ${fmt(op.irms.Q4, 2)} A；CIN ${fmt(op.icin_rms, 2)}、COUT ${fmt(op.icout_rms, 2)} Arms。</p>`;
  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const xs = [0], ys = [op.segments[0].i_start]; let t = 0;
  for (const sg of op.segments) { t += sg.dt; xs.push(t * 1e6); ys.push(sg.i_end); }
  // 兩個週期，看得出週期性
  const xs2 = xs.concat(xs.slice(1).map(x => x + T * 1e6)), ys2 = ys.concat(ys.slice(1));
  const vl = []; let tt = 0;
  for (let k = 0; k < 2; k++) op.segments.forEach((sg, i) => { if (tt > 0) vl.push({ x: tt * 1e6, label: "" }); tt += sg.dt; });
  plot($("#ch_vin_il"), { xlabel: "t (µs)", ylabel: "iL (A)", height: 230, xrange: [0, 2 * T * 1e6],
    series: [{ x: xs2, y: ys2, name: `iL @ ${fmt(v, 2)} V (${op.mode})`, color: css("--c1") },
      { x: [0, 2 * T * 1e6], y: [op.il_avg, op.il_avg], name: "平均", color: css("--muted"), dash: "4 3" }],
    vlines: vl });
}

$("#vin_slider").addEventListener("input", e => { sliderVin = Number(e.target.value); renderVin(); });
$("#vin_value").addEventListener("change", e => { sliderVin = Number(e.target.value); renderVin(); });
document.querySelectorAll("#vinpanel .quick button").forEach(b => b.addEventListener("click", () => { sliderVin = design[b.dataset.q]; renderVin(); }));

function update() {
  design.vin_direction = $("#vin_direction").value;
  saveDesign();
  renderVin();
  try {
    lastResult = calculate(design, $("#model").value);
    render(lastResult);
  } catch (e) {
    $("#results").innerHTML = `<div class="panel warn">計算錯誤：${e.message}</div>`;
    console.error(e);
  }
}

$("#model").addEventListener("change", update);
$("#vin_direction").addEventListener("change", update);
$("#theme").addEventListener("change", e => {
  if (e.target.value) document.documentElement.setAttribute("data-theme", e.target.value);
  else document.documentElement.removeAttribute("data-theme");
  update();
});
$("#reset").addEventListener("click", () => { design = defaultDesign(); sliderVin = null; buildInputs(); buildBasic(); $("#vin_direction").value = "rising"; update(); });
$("#export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({ inputs: design, results: lastResult }, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "lm51770_result.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$("#vin_direction").value = design.vin_direction || "rising";
buildInputs();
buildBasic();
update();
</script>
</body>
</html>
